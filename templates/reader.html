<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thomas' Calculus Reader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-[#0b0f19] text-slate-200 min-h-screen flex flex-col items-center select-none antialiased">
  
  <header class="w-full bg-slate-900/95 border-b border-slate-800/80 backdrop-blur sticky top-0 z-50 px-4 py-2.5 flex justify-between items-center shadow-lg">
    <a href="/" class="text-xs font-semibold text-indigo-400 hover:text-indigo-300 flex items-center gap-1.5 transition">
      <span>&larr;</span> Portal
    </a>

    <div class="flex items-center gap-2 text-xs font-mono bg-slate-950/80 px-3 py-1.5 rounded-lg border border-slate-800">
      <button id="prev" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 transition">&larr;</button>
      <span>p. <span id="page-num" class="text-indigo-400 font-bold">{{ page }}</span> / <span id="page-count">...</span></span>
      <button id="next" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 transition">&rarr;</button>
    </div>

    <a href="{{ pdf_url }}" target="_blank" class="text-xs text-slate-400 hover:text-white font-medium transition">
      Raw File
    </a>
  </header>

  <main class="w-full flex-1 flex justify-center items-start p-2 sm:p-6 overflow-auto">
    <div id="loading" class="text-xs font-mono text-slate-400 mt-12 animate-pulse">Streaming Thomas' Calculus...</div>
    <canvas id="the-canvas" class="border border-slate-800 rounded-xl shadow-2xl max-w-full hidden bg-white"></canvas>
  </main>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc = null;
    let pageNum = parseInt({{ page }}) || 1;
    let pageRendering = false;
    let pageNumPending = null;
    const canvas = document.getElementById('the-canvas');
    const ctx = canvas.getContext('2d');
    const loadingEl = document.getElementById('loading');

    function renderPage(num) {
      pageRendering = true;
      pdfDoc.getPage(num).then(page => {
        const viewport = page.getViewport({ scale: 1.5 });
        const containerWidth = Math.min(window.innerWidth - 16, 850);
        const scale = containerWidth / viewport.width;
        const scaledViewport = page.getViewport({ scale: scale * 1.5 });

        canvas.height = scaledViewport.height;
        canvas.width = scaledViewport.width;
        canvas.style.width = `${scaledViewport.width / 1.5}px`;

        const renderContext = { canvasContext: ctx, viewport: scaledViewport };
        const renderTask = page.render(renderContext);

        renderTask.promise.then(() => {
          pageRendering = false;
          loadingEl.classList.add('hidden');
          canvas.classList.remove('hidden');
          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });
      });
      document.getElementById('page-num').textContent = num;
    }

    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    document.getElementById('prev').addEventListener('click', () => {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
    });

    document.getElementById('next').addEventListener('click', () => {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
    });

    pdfjsLib.getDocument("{{ pdf_url }}").promise.then(pdf => {
      pdfDoc = pdf;
      document.getElementById('page-count').textContent = pdf.numPages;
      renderPage(pageNum);
    });
  </script>
</body>
</html>
